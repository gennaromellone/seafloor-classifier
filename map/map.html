<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seafloor Classifier — Drone Path Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 18px;
      background: #1a1d27;
      border-bottom: 1px solid #2e3147;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #fff;
      white-space: nowrap;
    }

    #drop-zone {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1.5px dashed #3a3f5c;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #888;
      transition: border-color .2s, color .2s;
      white-space: nowrap;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: #4ade80;
      color: #4ade80;
    }
    #drop-zone input { display: none; }

    #file-label {
      font-size: 12px;
      color: #6b7280;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #stats {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: #9ca3af;
      margin-left: auto;
      flex-wrap: wrap;
    }
    #stats span strong { color: #e0e0e0; }
    .dot {
      display: inline-block;
      width: 9px; height: 9px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .dot-green { background: #4ade80; }
    .dot-white { background: #f0f0f0; border: 1px solid #555; }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #9ca3af;
      white-space: nowrap;
    }
    .toggle-label { font-weight: 500; transition: color .2s; }
    .toggle-label.active { color: #4ade80; }

    .switch {
      position: relative;
      width: 40px; height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #374151;
      border-radius: 22px;
      cursor: pointer;
      transition: background .25s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .25s;
    }
    input:checked + .slider { background: #16a34a; }
    input:checked + .slider::before { transform: translateX(18px); }

    #legend {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #9ca3af;
    }
    #legend.visible { display: flex; }
    #legend-bar {
      width: 80px; height: 10px;
      border-radius: 4px;
      background: linear-gradient(to right, #90EE90, #006400);
      border: 1px solid #374151;
    }

    #map { flex: 1; width: 100%; }

    .leaflet-tooltip.frame-tip {
      background: #1a1d27;
      border: 1px solid #2e3147;
      color: #e0e0e0;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,.5);
      pointer-events: none;
    }
    .leaflet-tooltip.frame-tip table { border-collapse: collapse; }
    .leaflet-tooltip.frame-tip td { padding: 1px 6px 1px 0; }
    .leaflet-tooltip.frame-tip .lbl { color: #6b7280; }
    .leaflet-tooltip.frame-tip .pos { color: #4ade80; font-weight: 600; }
    .leaflet-tooltip.frame-tip .neg { color: #9ca3af; }
  </style>
</head>
<body>

<header>
  <h1>🌊 Seafloor Classifier — Drone Path</h1>

  <label id="drop-zone" title="Click or drag a CSV file here">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
         viewBox="0 0 24 24">
      <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5-5 5 5M12 5v11"/>
    </svg>
    Load CSV
    <input type="file" id="csv-input" accept=".txt,.csv" />
  </label>
  <span id="file-label">no file loaded</span>

  <div class="toggle-wrap">
    <span class="toggle-label active" id="lbl-binary">Binary</span>
    <label class="switch">
      <input type="checkbox" id="mode-toggle" />
      <span class="slider"></span>
    </label>
    <span class="toggle-label" id="lbl-conf">Confidence</span>
  </div>

  <div id="legend">
    <span>low</span>
    <div id="legend-bar"></div>
    <span>high</span>
  </div>

  <div id="stats">
    <span><span class="dot dot-green"></span>Posidonia: <strong id="cnt-pos">—</strong></span>
    <span><span class="dot dot-white"></span>Pianoro: <strong id="cnt-neg">—</strong></span>
    <span>Frames: <strong id="cnt-total">—</strong></span>
  </div>
</header>

<div id="map"></div>

<script>
// ── Map setup ─────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true, preferCanvas: true, maxZoom: 22 });

L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    attribution: 'Tiles &copy; Esri &mdash; Esri, DigitalGlobe, GeoEye, Earthstar Geographics, CNES/Airbus DS, USDA, USGS, AeroGRID, IGN',
    maxNativeZoom: 19,  // Esri World Imagery native max; Leaflet upscales beyond this
    maxZoom: 22,
  }
).addTo(map);

map.setView([40.23, 14.94], 16);

// ── State ─────────────────────────────────────────────────────────────────────
let frames         = [];
let markerLayer    = null;
let pathLayer      = null;
let confidenceMode = false;

// ── CSV parser ────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines[0].trim();
  const sep    = header.includes(';') ? ';' : ',';
  const cols   = header.split(sep).map(c => c.trim());

  function col(vals, name) {
    const i = cols.indexOf(name);
    return i >= 0 ? (vals[i] ?? '').trim() : '';
  }

  // Parse a confidence value — accepts both "0.669" and "66.9%" forms.
  function parseConf(v) {
    if (!v) return NaN;
    if (v.includes('%')) return parseFloat(v) / 100;
    return parseFloat(v);
  }

  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const v   = line.split(sep);
    const lat = parseFloat(col(v, 'lat'));
    const lon = parseFloat(col(v, 'lon'));
    if (isNaN(lat) || isNaN(lon)) continue;

    const q1c = parseConf(col(v, 'Q1_conf'));
    const q2c = parseConf(col(v, 'Q2_conf'));
    const q3c = parseConf(col(v, 'Q3_conf'));
    const q4c = parseConf(col(v, 'Q4_conf'));

    const valid = [q1c, q2c, q3c, q4c].filter(x => !isNaN(x));
    const meanConf = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : 0;

    rows.push({
      timestamp: col(v, 'timestamp'),
      lat, lon,
      q1c, q2c, q3c, q4c, meanConf,
      q1pos: parseInt(col(v, 'Q1_pos') || '0'),
      q2pos: parseInt(col(v, 'Q2_pos') || '0'),
      q3pos: parseInt(col(v, 'Q3_pos') || '0'),
      q4pos: parseInt(col(v, 'Q4_pos') || '0'),
      framePos: parseInt(col(v, 'frame_posidonia') || '0'),
    });
  }
  return rows;
}

// ── Colour helpers ────────────────────────────────────────────────────────────
function hexToRgb(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

function lerpColor(hex1, hex2, t) {
  const [r1,g1,b1] = hexToRgb(hex1);
  const [r2,g2,b2] = hexToRgb(hex2);
  return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
}

const C_LIGHT_GREEN = '#90EE90';
const C_DARK_GREEN  = '#006400';
const C_BINARY_GREEN = '#4ade80';
const C_WHITE       = '#f0f0f0';
const C_PATH        = '#60a5fa';

function markerFill(frame) {
  if (frame.framePos === 0) return C_WHITE;
  if (!confidenceMode)      return C_BINARY_GREEN;
  return lerpColor(C_LIGHT_GREEN, C_DARK_GREEN, frame.meanConf);
}

function markerStroke(frame) {
  return frame.framePos === 0 ? '#555' : '#166534';
}

// ── Tooltip ───────────────────────────────────────────────────────────────────
function badge(pos) {
  return pos ? '<span class="pos">Posidonia</span>' : '<span class="neg">Pianoro</span>';
}

function fmtPct(v) {
  return isNaN(v) ? '—' : (v * 100).toFixed(1) + '%';
}

function makeTooltip(f) {
  return `<table>
    <tr><td class="lbl">Time</td><td>${f.timestamp}</td></tr>
    <tr><td class="lbl">Coords</td><td>${f.lat.toFixed(6)}, ${f.lon.toFixed(6)}</td></tr>
    <tr><td class="lbl">Frame</td><td>${badge(f.framePos)}</td></tr>
    <tr><td class="lbl">Q1</td><td>${fmtPct(f.q1c)} ${badge(f.q1pos)}</td></tr>
    <tr><td class="lbl">Q2</td><td>${fmtPct(f.q2c)} ${badge(f.q2pos)}</td></tr>
    <tr><td class="lbl">Q3</td><td>${fmtPct(f.q3c)} ${badge(f.q3pos)}</td></tr>
    <tr><td class="lbl">Q4</td><td>${fmtPct(f.q4c)} ${badge(f.q4pos)}</td></tr>
    <tr><td class="lbl">Mean conf</td><td>${fmtPct(f.meanConf)}</td></tr>
  </table>`;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  if (markerLayer) { map.removeLayer(markerLayer); markerLayer = null; }
  if (pathLayer)   { map.removeLayer(pathLayer);   pathLayer   = null; }
  if (!frames.length) return;

  // drone path polyline
  pathLayer = L.polyline(
    frames.map(f => [f.lat, f.lon]),
    { color: C_PATH, weight: 1.5, opacity: 0.45 }
  ).addTo(map);

  // per-frame markers
  const group = L.layerGroup();
  frames.forEach(f => {
    const circle = L.circleMarker([f.lat, f.lon], {
      radius:      5,
      fillColor:   markerFill(f),
      fillOpacity: 0.88,
      color:       markerStroke(f),
      weight:      1,
    });
    circle._frameData = f;
    circle.bindTooltip(makeTooltip(f), {
      className: 'frame-tip',
      direction: 'top',
      offset:    [0, -6],
      sticky:    false,
    });
    circle.addTo(group);
  });
  markerLayer = group;
  group.addTo(map);

  map.fitBounds(pathLayer.getBounds(), { padding: [30, 30] });

  // header stats
  const pos = frames.filter(f => f.framePos === 1).length;
  document.getElementById('cnt-pos').textContent   = pos;
  document.getElementById('cnt-neg').textContent   = frames.length - pos;
  document.getElementById('cnt-total').textContent = frames.length;
}

// ── Update colours without full re-render ─────────────────────────────────────
function refreshColors() {
  if (!markerLayer) return;
  markerLayer.eachLayer(circle => {
    const f = circle._frameData;
    if (!f) return;
    circle.setStyle({
      fillColor: markerFill(f),
      color:     markerStroke(f),
    });
  });
}

// ── Mode toggle ───────────────────────────────────────────────────────────────
document.getElementById('mode-toggle').addEventListener('change', function () {
  confidenceMode = this.checked;
  document.getElementById('lbl-binary').classList.toggle('active', !confidenceMode);
  document.getElementById('lbl-conf').classList.toggle('active',    confidenceMode);
  document.getElementById('legend').classList.toggle('visible',      confidenceMode);
  refreshColors();
});

// ── File loading ──────────────────────────────────────────────────────────────
function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    frames = parseCSV(e.target.result);
    document.getElementById('file-label').textContent = file.name;
    render();
  };
  reader.readAsText(file);
}

document.getElementById('csv-input').addEventListener('change', function () {
  loadFile(this.files[0]);
});

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop',      e  => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  loadFile(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
